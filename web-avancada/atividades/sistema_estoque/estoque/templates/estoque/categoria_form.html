{% extends "estoque/base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block conteudo %}
<h1>{{ titulo }}</h1>
<form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Salvar</button>
    <a href="{% url 'estoque:categoria_lista' %}">Cancelar</a>
</form>
{% endblock %}
