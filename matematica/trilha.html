<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Trilha</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <h1>Trilha de estudo</h1>
      <p class="lead">
        Do zero ao avançado, na ordem. Marque o que concluir; o progresso fica
        salvo neste navegador.
      </p>
      <div class="bar"><i id="prog"></i></div>
      <p id="pt"></p>
      <div id="trilha">
        <h2>Etapa 1: base</h2>
        <label class="chk"
          ><input type="checkbox" /> Frações, potências, fatorial e equações do
          1º grau</label
        >
        <label class="chk"
          ><input type="checkbox" /> Ler símbolos: ∈ ⊂ ∪ ∩ ⇒ ⇔ ∀ ∃</label
        >
        <h2>Etapa 2: conjuntos e contagem</h2>
        <label class="chk"
          ><input type="checkbox" /> Hierarquia ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ e ∈ × ⊂</label
        >
        <label class="chk"
          ><input type="checkbox" /> Operações e inclusão-exclusão com 3
          conjuntos</label
        >
        <label class="chk"
          ><input type="checkbox" /> Princípio multiplicativo, C(n,p) e "total −
          proibidos"</label
        >
        <h2>Etapa 3: relações</h2>
        <label class="chk"
          ><input type="checkbox" /> Produto cartesiano e pares ordenados</label
        >
        <label class="chk"
          ><input type="checkbox" /> Reflexiva, simétrica, antissimétrica,
          transitiva</label
        >
        <label class="chk"
          ><input type="checkbox" /> Equivalência, ordem e fecho
          reflexivo</label
        >
        <h2>Etapa 4: funções</h2>
        <label class="chk"
          ><input type="checkbox" /> Domínio, contradomínio, imagem; ler
          gráficos</label
        >
        <label class="chk"><input type="checkbox" /> Composta e inversa</label>
        <label class="chk"
          ><input type="checkbox" /> Injetora, sobrejetora, bijetora com prova
          algébrica</label
        >
        <h2>Etapa 5: provas e indução</h2>
        <label class="chk"
          ><input type="checkbox" /> Prova direta e contraposição</label
        >
        <label class="chk"
          ><input type="checkbox" /> Indução: base, hipótese, passo</label
        >
        <h2>Etapa 6: avançado e revisão</h2>
        <label class="chk"
          ><input type="checkbox" /> Casa dos pombos, cardinalidade,
          recorrências</label
        >
        <label class="chk"
          ><input type="checkbox" /> Quiz com 85% ou mais, duas vezes
          seguidas</label
        >
        <label class="chk"
          ><input type="checkbox" /> Refazer só os erros e treinar a cola
          rápida</label
        >
      </div>
    </main>
    <script src="js/quiz.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
